<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- light-dark(): 1 つの式にライトとダークの色を並べて書く。color-scheme に light と dark の両方を挙げておく -->
  <style>
    :root { color-scheme: light dark; }
    .sky-top { stop-color: light-dark(#4fa3e0, #0a1230); }
    .sky-bottom { stop-color: light-dark(#d4f0fc, #2b3d75); }
    .glow { fill: light-dark(#ffffff, #e8e4cf); opacity: .45; }
    .orb { fill: light-dark(#ffc23c, #f3efdc); }
    .crater { fill: light-dark(transparent, #d3cdb2); }
    .star { fill: light-dark(transparent, #ffffff); }
    .cloud { fill: light-dark(#ffffff, #33416a); }
    .hill-far { fill: light-dark(#93c47d, #1b3540); }
    .hill-near { fill: light-dark(#4e9a5e, #10242b); }
    .tree { fill: light-dark(#2f6b3f, #0a181d); }
    .wall { fill: light-dark(#f4ead2, #2a2c40); }
    .roof { fill: light-dark(#c4473f, #55283a); }
    .window { fill: light-dark(#7aa3c8, #ffcf5c); }
    .door { fill: light-dark(#8b5a3c, #1a1b29); }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sky-top"/>
      <stop offset="1" class="sky-bottom"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="320" height="200" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="320" height="200" fill="url(#sky)"/>
    <g class="star">
      <circle cx="34" cy="28" r="1.6"/>
      <circle cx="78" cy="52" r="1.2"/>
      <circle cx="120" cy="22" r="1.8"/>
      <circle cx="160" cy="46" r="1.1"/>
      <circle cx="196" cy="18" r="1.4"/>
      <circle cx="292" cy="96" r="1.2"/>
      <circle cx="58" cy="84" r="1"/>
      <circle cx="300" cy="22" r="1.5"/>
    </g>
    <circle class="glow" cx="246" cy="54" r="36"/>
    <circle class="orb" cx="246" cy="54" r="22"/>
    <circle class="crater" cx="238" cy="47" r="4.5"/>
    <circle class="crater" cx="253" cy="61" r="3.2"/>
    <circle class="crater" cx="254" cy="44" r="2.2"/>
    <path class="cloud" d="M40 74a12 12 0 0 1 22-7 15 15 0 0 1 27 5 10 10 0 0 1 2 20H44a10 10 0 0 1-4-18z"/>
    <path class="cloud" d="M170 92a9 9 0 0 1 16-5 11 11 0 0 1 20 4 8 8 0 0 1 1 15h-34a7 7 0 0 1-3-14z"/>
    <path class="hill-far" d="M0 142c40-26 84-34 130-18s86 10 120-8 54-14 70-6v90H0z"/>
    <path class="hill-near" d="M0 168c52-22 110-24 170-8s110 14 150-2v42H0z"/>
    <g class="tree">
      <path d="M58 160l12-30 12 30z"/>
      <path d="M74 158l9-22 9 22z"/>
      <path d="M268 150l10-26 10 26z"/>
    </g>
    <path class="wall" d="M186 132h44v30h-44z"/>
    <path class="roof" d="M180 134l28-22 28 22z"/>
    <rect class="window" x="193" y="140" width="11" height="10" rx="1.5"/>
    <rect class="window" x="213" y="140" width="11" height="10" rx="1.5"/>
    <rect class="door" x="203" y="150" width="10" height="12" rx="1.5"/>
  </g>
</svg>
