<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="200" viewBox="0 0 320 200" onload="alert('onload')">
  <!-- 無害化の確認: script・イベント属性・外部の画像・javascript: の URL・foreignObject は描く前に取り除く -->
  <style>
    :root {
      --paper: #fffaf0; --edge: #e4d8c3; --ink: #3d3326; --sub: #8a7a62;
      --stamp: #d95f43; --sea: #3f9cc4; --sea-2: #8fd0e8; --sun: #f6b73c; --sail: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2a251e; --edge: #4a4134; --ink: #f1e8d8; --sub: #b3a487;
        --stamp: #ff8b6e; --sea: #5fb8de; --sea-2: #2f6a85; --sun: #ffd27a; --sail: #e9e2d4;
      }
    }
    .paper { fill: var(--paper); stroke: var(--edge); stroke-width: 1.5; }
    .ink { fill: var(--ink); font-family: Georgia, serif; }
    .sub { fill: var(--sub); font-family: system-ui, sans-serif; font-size: 10px; }
    .rule { stroke: var(--edge); stroke-width: 1.2; }
    .stamp { fill: none; stroke: var(--stamp); stroke-width: 2; stroke-dasharray: 3 2; }
    .postmark { fill: none; stroke: var(--sub); stroke-width: 1.4; opacity: .8; }
    .sun { fill: var(--sun); }
    .sea { fill: var(--sea); }
    .sea-2 { fill: var(--sea-2); }
    .sail { fill: var(--sail); stroke: var(--ink); stroke-width: 1; }
    .hull { fill: var(--stamp); }
  </style>
  <script>alert('script')</script>
  <rect class="paper" x="8" y="8" width="304" height="184" rx="10"/>
  <path class="rule" d="M168 30v140"/>
  <text class="ink" x="28" y="50" font-size="22" font-style="italic">Greetings</text>
  <text class="sub" x="28" y="66">from the seaside</text>
  <circle class="sun" cx="126" cy="96" r="13"/>
  <path class="sea-2" d="M24 122c14-6 28-6 42 0s28 6 42 0 28-6 42 0v34H24z"/>
  <path class="sea" d="M24 134c14-6 28-6 42 0s28 6 42 0 28-6 42 0v22H24z"/>
  <path class="hull" d="M58 120h34l-6 8H64z"/>
  <path class="sail" d="M75 84v34H58zM78 90v28h14z"/>
  <rect class="stamp" x="244" y="26" width="48" height="56" rx="3"/>
  <image href="https://example.com/stamp.png" x="248" y="30" width="40" height="48"/>
  <circle class="postmark" cx="236" cy="70" r="18"/>
  <path class="postmark" d="M252 62c8-4 14 4 22 0s14 4 22 0M252 72c8-4 14 4 22 0s14 4 22 0"/>
  <path class="rule" d="M184 120h108M184 142h108M184 164h108"/>
  <a href="javascript:alert('link')">
    <text class="sub" x="28" y="176">クリックしてください</text>
  </a>
  <foreignObject x="184" y="92" width="108" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml">HTML の中身</div>
  </foreignObject>
  <rect x="8" y="8" width="304" height="184" fill="transparent" onclick="alert('click')"/>
</svg>
