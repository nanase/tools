<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170">
  <!-- 失敗例: 背景だけダークに対応し、文字とアイコンの色は属性で決め打ちしている。ダークでは名前と線が読めなくなる -->
  <style>
    .card { fill: #ffffff; stroke: #e2e6ee; }
    .band { fill: #ffe7d6; }
    .chip { fill: #eef2f8; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1c2130; stroke: #2e3546; }
      .band { fill: #3a2a24; }
      .chip { fill: #283044; }
    }
  </style>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="1" stop-color="#e2557a"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="10" y="10" width="300" height="150" rx="16"/>
    </clipPath>
  </defs>
  <rect class="card" x="10.5" y="10.5" width="299" height="149" rx="16"/>
  <rect class="band" x="10" y="10" width="300" height="44" clip-path="url(#round)"/>
  <circle cx="62" cy="64" r="30" fill="url(#avatar)" stroke="#ffffff" stroke-width="4"/>
  <path d="M50 70c3 5 21 5 24 0" fill="none" stroke="#3b1f2b" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="53" cy="58" r="2.6" fill="#3b1f2b"/>
  <circle cx="71" cy="58" r="2.6" fill="#3b1f2b"/>
  <text x="104" y="80" fill="#1b1f2a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Sora Aoyama</text>
  <text x="104" y="98" fill="#7a8396" font-family="system-ui, sans-serif" font-size="11.5">Illustrator · Tokyo</text>
  <g fill="none" stroke="#1b1f2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 70l4.5 9 10 1.5-7.2 7 1.7 9.9-9-4.7-9 4.7 1.7-9.9-7.2-7 10-1.5z"/>
  </g>
  <rect class="chip" x="28" y="118" width="64" height="24" rx="12"/>
  <rect class="chip" x="100" y="118" width="58" height="24" rx="12"/>
  <rect class="chip" x="166" y="118" width="74" height="24" rx="12"/>
  <g fill="#1b1f2a" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">
    <text x="60" y="134">SVG</text>
    <text x="129" y="134">Icons</text>
    <text x="203" y="134">Dark mode</text>
  </g>
</svg>
